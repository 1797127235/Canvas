server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 默认给 /api 的业务 JSON 设上限（生成请求改传素材身份后只需 KB 级）；
    # 媒体上传单独放开，与后端一致。慢超时覆盖视频生成查询等长请求。
    client_max_body_size 8m;

    # SPA 更新后避免浏览器拿着旧 index.html 找已被替换的哈希资源。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 哈希文件名资源可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 媒体上传不设上限：原始字节流，按内容而非 JSON 请求体计量。
    location /api/media {
        proxy_pass http://api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
    }

    location /api/ {
        proxy_pass http://api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 取后端各档上限中的最大值（工作区 8 MiB）；生成 1 MiB、身份 4 KiB 由 api 分路径把关。
        client_max_body_size 8m;
    }
}
