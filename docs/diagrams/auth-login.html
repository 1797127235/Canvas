<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录流程 · 无限画布</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }
    .lede { font-size: 0.85rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 身份流程</p>
    <h1>登录：POST /api/sessions</h1>
    <p class="lede">行锁把「锁定检查 → 验密 → 建会话」串行化；错误响应不区分账号不存在与密码错误。</p>

    <svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="login-flow-title login-flow-desc">
      <title id="login-flow-title">登录流程</title>
      <desc id="login-flow-desc">流程图：登录请求经前置校验与限流后，在数据库事务内锁定账号行，依次判断账号存在、是否处于锁定、密码是否正确，成功则创建会话。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <line x1="348" y1="80"  x2="348" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="168" x2="348" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="256" x2="348" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="360" x2="348" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="464" x2="348" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="568" x2="348" y2="600" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="348" y1="664" x2="348" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="476" y1="140" x2="676" y2="140" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="476" y1="228" x2="676" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="476" y1="324" x2="676" y2="324" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="476" y1="428" x2="676" y2="428" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="476" y1="532" x2="676" y2="532" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- arrow labels -->
      <rect x="556" y="116" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="128" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">失败</text>
      <rect x="556" y="204" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="216" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">超限</text>
      <rect x="556" y="300" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="312" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">否</text>
      <rect x="556" y="404" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="416" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">是</text>
      <rect x="556" y="508" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="520" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">否</text>

      <!-- start -->
      <rect x="220" y="32" width="256" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="220" y="32" width="256" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="348" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">提交邮箱与密码</text>

      <!-- 前置校验 -->
      <rect x="220" y="112" width="256" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="112" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">前置校验</text>
      <text x="348" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">origin · 4KiB · zod</text>

      <!-- 限流 -->
      <rect x="220" y="200" width="256" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="200" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">登录限流</text>
      <text x="348" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30 / 15min · HMAC(ip)</text>

      <!-- 事务起止标记 -->
      <text x="80" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BEGIN</text>
      <line x1="80" y1="308" x2="80" y2="664" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="80" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMMIT</text>

      <!-- d1 账号存在 -->
      <polygon points="348,288 476,324 350,360 220,324" fill="#f5f5f5"/>
      <polygon points="348,288 476,324 350,360 220,324" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">账号存在？</text>

      <!-- d2 仍在锁定 -->
      <polygon points="348,392 476,428 350,464 220,428" fill="#f5f5f5"/>
      <polygon points="348,392 476,428 350,464 220,428" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">仍在锁定？</text>

      <!-- d3 密码正确 -->
      <polygon points="348,496 476,532 350,568 220,532" fill="#f5f5f5"/>
      <polygon points="348,496 476,532 350,568 220,532" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">密码正确？</text>

      <!-- 建会话（焦点） -->
      <rect x="220" y="600" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="600" width="256" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="348" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">清零计数并建会话</text>
      <text x="348" y="644" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sid → sha256(sid) only</text>

      <!-- end -->
      <rect x="220" y="696" width="256" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="220" y="696" width="256" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="348" y="724" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">201 + Set-Cookie</text>

      <!-- error exits -->
      <rect x="680" y="112" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="112" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">403 · 413 · 422</text>

      <rect x="680" y="200" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="200" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">429 RATE_LIMITED</text>

      <rect x="680" y="288" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="288" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">401 INVALID_CREDENTIALS</text>
      <text x="800" y="332" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">dummy 验密 · 等耗时</text>

      <rect x="680" y="392" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="392" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">429 LOGIN_LOCKED</text>

      <rect x="680" y="496" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="496" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">401 · 失败计数 +1</text>
      <text x="800" y="540" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">满 5 次锁 15 分钟</text>

      <!-- legend -->
      <line x1="40" y1="776" x2="960" y2="776" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="788" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="800" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">处理步骤</text>
      <polygon points="224,788 236,794 224,800 212,794" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="248" y="800" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">判断分支</text>
      <rect x="332" y="788" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="352" y="800" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">事务边界</text>
      <rect x="452" y="788" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="472" y="800" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">错误出口</text>
    </svg>
  </div>
</body>
</html>
