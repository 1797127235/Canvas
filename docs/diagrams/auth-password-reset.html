<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码重置流程 · 无限画布</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }
    .lede { font-size: 0.85rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 身份流程</p>
    <h1>密码重置：两段式</h1>
    <p class="lede">申请时无论邮箱是否注册都返回 204（防账号枚举）；确认时换密码、踢掉全部会话、清空令牌在同一事务内完成。</p>

    <svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reset-flow-title reset-flow-desc">
      <title id="reset-flow-title">密码重置流程</title>
      <desc id="reset-flow-desc">流程图分两段：第一段提交邮箱后校验配置、限流并写入一次有效令牌，仅当邮箱已注册才发信；第二段用户点击邮件链接，校验令牌有效性后在同一事务内更换密码、注销全部会话并清空令牌。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== phase 1 arrows ===== -->
      <line x1="348" y1="100" x2="348" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="188" x2="348" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="284" x2="348" y2="316" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="476" y1="348" x2="676" y2="348" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="476" y1="412" x2="676" y2="412" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <rect x="556" y="324" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="336" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">发出</text>
      <rect x="556" y="388" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="400" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">失败</text>

      <!-- ===== phase separator ===== -->
      <line x1="120" y1="512" x2="880" y2="512" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="6,5"/>
      <rect x="384" y="500" width="192" height="24" rx="3" fill="#f5f5f5"/>
      <text x="480" y="516" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">用户点击邮件中的链接</text>

      <!-- ===== phase 2 arrows ===== -->
      <line x1="348" y1="532" x2="348" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="348" y1="636" x2="348" y2="668" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="348" y1="756" x2="348" y2="788" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="476" y1="588" x2="676" y2="588" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <rect x="556" y="564" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="576" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">否</text>

      <!-- ===== phase 1 nodes ===== -->
      <text x="220" y="44" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif">① 申请重置 · POST /api/password-resets</text>

      <rect x="220" y="52" width="256" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="220" y="52" width="256" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="348" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">提交注册邮箱</text>

      <rect x="220" y="132" width="256" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="132" width="256" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">配置检查与限流</text>
      <text x="348" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SMTP? · 5 / hour</text>

      <rect x="220" y="220" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="220" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">作废旧令牌并写新令牌</text>
      <text x="348" y="264" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">未注册则不写，仍返回 204</text>

      <rect x="220" y="316" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="316" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">发送重置邮件</text>
      <text x="348" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30 min · sha256(token)</text>

      <rect x="680" y="316" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="316" width="256" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="808" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">204 已受理</text>
      <text x="808" y="360" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">不区分邮箱是否注册</text>

      <rect x="680" y="380" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="380" width="256" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="808" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">502 MAIL_FAILED</text>
      <text x="808" y="424" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">回收令牌，避免用户卡死</text>

      <!-- ===== phase 2 nodes ===== -->
      <text x="220" y="556" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif">② 设置新密码 · POST /api/password-resets/confirm</text>

      <polygon points="348,564 476,600 350,636 220,600" fill="#f5f5f5"/>
      <polygon points="348,564 476,600 350,636 220,600" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">令牌有效？</text>

      <rect x="220" y="668" width="256" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="668" width="256" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="348" y="692" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">同一事务内三件事</text>
      <text x="348" y="708" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">update user</text>
      <text x="348" y="724" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">换密码 · 删全部会话 · 清令牌</text>

      <rect x="680" y="564" width="256" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="564" width="256" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="808" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">422 INVALID_RESET_TOKEN</text>
      <text x="808" y="612" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">需重新申请</text>

      <rect x="220" y="788" width="256" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="220" y="788" width="256" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="348" y="816" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">204 · 跳转登录</text>

      <!-- legend -->
      <line x1="40" y1="848" x2="960" y2="848" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="872" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="860" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="872" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">处理步骤</text>
      <rect x="224" y="860" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="244" y="872" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">事务边界</text>
      <rect x="340" y="860" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="360" y="872" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">出口</text>
    </svg>
  </div>
</body>
</html>
