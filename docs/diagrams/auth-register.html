<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册流程 · 无限画布</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }
    .lede { font-size: 0.85rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 身份流程</p>
    <h1>注册：POST /api/users</h1>
    <p class="lede">邮箱在此系统中等同用户名，注册不验证邮箱归属，也没有邀请码。</p>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="register-flow-title register-flow-desc">
      <title id="register-flow-title">注册流程</title>
      <desc id="register-flow-desc">流程图：浏览器提交邮箱密码，经前置校验、限流与密码哈希后，在同一事务内写入账号与会话，任一步失败即返回对应错误码。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows first -->
      <line x1="380" y1="88"  x2="380" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="192" x2="380" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="296" x2="380" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="400" x2="380" y2="448" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="504" x2="380" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="500" y1="164" x2="696" y2="164" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="500" y1="268" x2="696" y2="268" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="500" y1="476" x2="696" y2="476" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- arrow labels: mask height 16, 8px gap, baseline = line - 12 -->
      <rect x="576" y="140" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="152" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">失败</text>
      <rect x="576" y="244" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="256" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">超限</text>
      <rect x="576" y="452" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="464" fill="#7a8399" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">重复</text>

      <!-- start -->
      <rect x="260" y="40" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="260" y="40" width="240" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="380" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">提交邮箱与密码</text>

      <!-- 前置校验 -->
      <rect x="260" y="136" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="136" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">前置校验</text>
      <text x="380" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">origin · 4KiB · zod</text>

      <!-- 限流 -->
      <rect x="260" y="240" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="240" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">注册限流</text>
      <text x="380" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10 / hour · HMAC(ip)</text>

      <!-- 哈希 -->
      <rect x="260" y="344" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="344" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">归一化并哈希</text>
      <text x="380" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trim · lower · argon2id</text>

      <!-- 事务（焦点） -->
      <rect x="260" y="448" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="448" width="240" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="380" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">同一事务写入</text>
      <text x="380" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">users + sessions</text>

      <!-- end -->
      <rect x="260" y="552" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="260" y="552" width="240" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="380" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">201 + Set-Cookie</text>

      <!-- error exits -->
      <rect x="700" y="136" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="136" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">403 · 413 · 422</text>

      <rect x="700" y="240" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="240" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">429 RATE_LIMITED</text>

      <rect x="700" y="448" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="448" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">409 EMAIL_EXISTS</text>

      <!-- legend -->
      <line x1="40" y1="632" x2="960" y2="632" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="644" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="656" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">处理步骤</text>
      <rect x="224" y="644" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="244" y="656" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">事务边界</text>
      <rect x="340" y="644" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="360" y="656" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">错误出口</text>
    </svg>
  </div>
</body>
</html>
