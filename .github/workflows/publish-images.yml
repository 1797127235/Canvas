# 质量门禁 → GHCR 镜像 → main 自动部署到生产 WSL；PR 和版本 tag 不部署。
# 触发：推送到 main、打版本 tag（v*）、PR 到 main（只跑门禁）、或手动触发。
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this ref to production after verification and image publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 发布前门禁：两端类型检查 + 测试。任一失败都不构建镜像。
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infinite_canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinite_canvas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      # 视频海报（server/src/media.ts）依赖 ffmpeg，生产镜像已装（Dockerfile.api）；
      # runner 默认没有，不装则 account-media 测试报 spawn ffmpeg ENOENT。
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Deployment regression tests
        run: |
          bash -n scripts/deploy.sh
          python3 scripts/deploy.test.py

      - name: Web type check
        working-directory: web
        run: bun run typecheck
      - name: Web tests
        working-directory: web
        run: bun test

      - name: Server type check
        working-directory: server
        run: bun run typecheck

      # 集成测试需要一个独立测试库，且库名必须以 _test 结尾（见 server/tests/support/database.ts）。
      - name: Create test database
        run: psql -h 127.0.0.1 -U postgres -d infinite_canvas -c "CREATE DATABASE infinite_canvas_test;"
        env:
          PGPASSWORD: postgres
      - name: Apply schema to test database
        run: |
          for file in server/sql/*.sql; do
            psql -h 127.0.0.1 -U postgres -d infinite_canvas_test -v ON_ERROR_STOP=1 -q -f "$file"
          done
        env:
          PGPASSWORD: postgres
      - name: Server tests
        working-directory: server
        run: bun run test
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: "4100"
          APP_ORIGIN: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/infinite_canvas
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/infinite_canvas_test
          RATE_LIMIT_SECRET: ci-only-secret

  publish:
    needs: verify
    # PR 只跑质量门禁，不推送镜像。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: api
            dockerfile: Dockerfile.api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签：分支名、sha-<短哈希>（回滚用）、版本 tag（v* 时）、main 上额外更新 latest。
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/infinite-canvas-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.deploy_production == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: http://openai2api.com:3015
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CONFIG'
          Host canvas-production
            HostName openai2api.com
            Port 2222
            User miaoda
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Transfer immutable images over SSH
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          images=("ghcr.io/$owner/infinite-canvas-api:sha-$GITHUB_SHA" "ghcr.io/$owner/infinite-canvas-web:sha-$GITHUB_SHA")
          for image in "${images[@]}"; do timeout 180s docker pull "$image"; done
          timeout 420s bash -o pipefail -c 'docker save "$@" | gzip -1 | ssh canvas-production "timeout 390s docker load"' _ "${images[@]}"

      - name: Deploy immutable images and verify production
        run: |
          set -euo pipefail
          manifest=$(mktemp -d)
          trap 'rm -rf -- "$manifest"' EXIT
          printf '%s\n' "$GITHUB_SHA" > "$manifest/revision"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$manifest/repository"
          tar -czf - scripts/deploy.sh docker-compose.yml server/sql/001-identity.sql server/sql/002-identity-rate-limits.sql -C "$manifest" revision repository | ssh canvas-production '
            set -eu
            release=$(mktemp -d /tmp/canvas-deploy.XXXXXX)
            trap '"'"'rm -rf -- "$release"'"'"' EXIT
            tar -xzf - -C "$release"
            read -r revision < "$release/revision"
            read -r repository < "$release/repository"
            bash "$release/scripts/deploy.sh" "$revision" /mnt/d/infinite-canvas-v2 "$repository" "$release"
          '
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 http://openai2api.com:3015/api/health | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
