# 多用户生产栈：PostgreSQL + 后端 + 前端。镜像由 GitHub Actions 构建后推到 GHCR，服务器只拉取不构建。
# 首次使用复制 .env.example 为 .env 并填写密钥；本地需要自行构建时叠加 docker-compose.build.yml。
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: infinite_canvas
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinite_canvas -d infinite_canvas"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性初始化：001/002 身份表无 IF NOT EXISTS，已存在时跳过；003~005 由后端启动时自动补建。
  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./server/sql:/sql:ro
    entrypoint:
      - sh
      - -ec
      - |
        if psql -h db -U infinite_canvas -d infinite_canvas -tAc "SELECT to_regclass('public.users')" | grep -q users; then
          echo "identity schema already exists, skip 001/002"
        else
          psql -h db -U infinite_canvas -d infinite_canvas -v ON_ERROR_STOP=1 -f /sql/001-identity.sql
          psql -h db -U infinite_canvas -d infinite_canvas -v ON_ERROR_STOP=1 -f /sql/002-identity-rate-limits.sql
        fi

  api:
    image: ${IMAGE_API:-ghcr.io/1797127235/infinite-canvas-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # 容器内固定连接同栈数据库；APP_ORIGIN、密钥等其余变量来自 .env。
      DATABASE_URL: postgresql://infinite_canvas:${POSTGRES_PASSWORD}@db:5432/infinite_canvas
    volumes:
      - media_data:/app/server/dist/data/media
      # 上游目录：全部模型共用同一 baseUrl，账号 Key 只在这里配置的上游做模型发现。
      - ./server/config/catalog.json:/app/server/config/catalog.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # api 记录每请求审计日志，单独放大轮转：50MB × 10 ≈ 500MB。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  web:
    image: ${IMAGE_WEB:-ghcr.io/1797127235/infinite-canvas-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3015}:80"
    logging: *default-logging

volumes:
  db_data:
  media_data:
